name: Flutter + FRB

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  flutter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            artifact: monolith-flutter-linux
            output: flutter_app/build/linux/x64/release/bundle
            native_library: flutter_app/build/linux/x64/release/bundle/lib/libmonolith.so
          - os: windows-latest
            platform: windows
            artifact: monolith-flutter-windows
            output: flutter_app/build/windows/x64/runner/Release
            native_library: flutter_app/build/windows/x64/runner/Release/monolith.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Resolve Flutter dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Analyze Dart
        working-directory: flutter_app
        run: flutter analyze
      - name: Test widgets
        working-directory: flutter_app
        run: flutter test
      - name: Build Flutter desktop with Rust native library
        working-directory: flutter_app
        run: flutter build ${{ matrix.platform }} --release
      - name: Exercise native FRB and offline SQLite
        working-directory: flutter_app
        env:
          MONOLITH_FRB_LIB: ${{ github.workspace }}/${{ matrix.native_library }}
        run: flutter test test/frb_integration_test.dart
      - name: Upload unified application bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 14
